name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs are cancelled so a force-push does not leave stale model
# downloads and npm installs burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Ruff targets py311 (backend/ruff.toml) and the README documents 3.11.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # node is not a backend dependency, but tests/test_dataviz_contract.py runs the frontend's
      # dataviz validator under node, so this job needs the same "22" pin as the others.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The runtime stack is required, not just the dev tools: app/main.py imports fastembed at
      # module scope and six test modules import app.main, so the suite cannot even be collected
      # without it. (app/encoders.py and app/reranker.py import it lazily and are faked in tests.)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      # test_budget_lua.py runs the real shipped _BUDGET_LUA under lua5.1 and is the only thing
      # catching drift between that script and the Python model. It skips itself when the
      # interpreter is absent, so without this step CI would pass with the spend cap unverified.
      - name: Install lua5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1
          lua5.1 -v
      # `set -o pipefail` is load-bearing: without it `tee` would swallow a pytest failure.
      - name: Pytest (no skipped tests)
        run: |
          set -o pipefail
          python -m pytest -rs | tee /tmp/pytest.log
          if grep -qE '[0-9]+ skipped' /tmp/pytest.log; then
            echo "::error::pytest skipped tests in CI. The suite must be fully covered; see the SKIPPED lines above."
            exit 1
          fi
      # The coverage figures in TEST_COVERAGE_GAPS.md are generated and nothing else keeps them
      # honest, so this step re-measures and fails the build on drift. It re-runs the suite a
      # second time under pytest-cov, reusing this job's installed dependencies.
      - name: Coverage document is not stale
        run: python scripts/measure_coverage.py

  frontend:
    name: frontend (lint + typecheck + build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Vitest
        run: npm test

  security:
    name: security (pip-audit + npm audit + gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: gitleaks scans commits, so a shallow clone would miss
      # secrets that are already deleted from the tip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # pip-audit is pinned in requirements-dev.txt so CI resolves the same
      # version the project documents.
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      # Policy: fail the build on ANY advisory. There is no ignore list and no
      # --ignore-vuln flag. The seven starlette advisories this gate used to
      # suppress (PYSEC-2026-1943/1941/161/2281/2280/249/248) were reachable
      # only through the old fastapi==0.115.0 pin, which capped starlette below
      # 0.39; issue #331 raised fastapi to 0.141.1 and pinned starlette 1.7.0
      # directly, so every fixed release is reachable and nothing is waived.
      - name: pip-audit (runtime dependencies)
        run: python -m pip_audit -r backend/requirements.txt
      - name: pip-audit (dev dependencies)
        run: python -m pip_audit -r backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # The only current advisory is a moderate vitest/@vitest/mocker
      # path-traversal issue, which is below --audit-level=high. The gate is
      # the high boundary, so a new high/critical advisory fails the job.
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          curl -sSfLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      # gitleaks exits non-zero when it finds a leak, so this step fails the job.
      # The scan is pinned to HEAD instead of gitleaks' default `--all`: a
      # fetch-depth-0 checkout has every branch in the object store, and
      # `--all` would report secrets committed on unrelated branches, turning
      # this job red for code the PR never touched. HEAD's history is complete
      # for this purpose -- a pull_request checkout is the merge commit, so it
      # contains both the PR branch and every commit it branched off from.
      - name: Secret scan
        run: gitleaks detect --source . --redact --no-banner --log-opts="-p -U0 --full-history HEAD"
