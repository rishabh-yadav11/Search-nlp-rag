name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# cancel-in-progress stops a force-push leaving superseded runs burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Ruff targets py311 (backend/ruff.toml) and the README documents 3.11.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # tests/test_dataviz_contract.py is the only coverage of the frontend's dataviz
      # validator and runs it under node >= 22.6, so backend needs the same "22" pin;
      # no npm cache, this job installs no node packages.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The runtime stack is required, not just dev tools: app/main.py imports fastembed
      # at module scope and six test modules import app.main, so collection needs it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      # tests/test_budget_lua.py runs the real shipped _BUDGET_LUA under lua5.1 and is the
      # only check the spend cap matches the Python model; it skips silently when the
      # interpreter is absent, so it must be installed (lua5.1 is in noble universe).
      - name: Install lua5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1
          lua5.1 -v
      # -rs prints skip reasons and the grep turns a silent skip red; set -o pipefail is
      # load-bearing so tee cannot swallow a pytest failure.
      - name: Pytest (no skipped tests)
        run: |
          set -o pipefail
          python -m pytest -rs | tee /tmp/pytest.log
          if grep -qE '[0-9]+ skipped' /tmp/pytest.log; then
            echo "::error::pytest skipped tests in CI. The suite must be fully covered; see the SKIPPED lines above."
            exit 1
          fi
      # TEST_COVERAGE_GAPS.md's generated block has no other keeper and rots silently, so
      # this re-runs the suite under pytest-cov and fails the build on mismatch; it lives
      # in this job to reuse the installed dependencies.
      - name: Coverage document is not stale
        run: python scripts/measure_coverage.py

  frontend:
    name: frontend (lint + typecheck + build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Vitest
        run: npm test

  security:
    name: security (pip-audit + npm audit + gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # gitleaks scans commits, so a shallow clone would miss secrets already deleted from the tip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # pip-audit is pinned in requirements-dev.txt so CI resolves the same
      # version the project documents.
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      # Policy: fail on ANY advisory, no ignore list. Every fixed starlette release is
      # reachable through the current fastapi/starlette pins, so nothing is waived.
      - name: pip-audit (runtime dependencies)
        run: python -m pip_audit -r backend/requirements.txt
      - name: pip-audit (dev dependencies)
        run: python -m pip_audit -r backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # The gate is the high boundary: the only current advisory is moderate, so a new
      # high/critical advisory is what fails this job.
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          curl -sSfLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      # gitleaks exits non-zero on a leak, failing the job. Scanning HEAD instead of
      # --all (a fetch-depth-0 checkout holds every branch) keeps unrelated-branch secrets
      # from reddening a PR, and a pull_request checkout is the merge commit, so HEAD's
      # history is complete.
      - name: Secret scan
        run: gitleaks detect --source . --redact --no-banner --log-opts="-p -U0 --full-history HEAD"
