name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs are cancelled so a force-push does not leave stale model
# downloads and npm installs burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Ruff targets py311 (backend/ruff.toml) and the README documents 3.11.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # node is not a backend dependency; the dataviz validator whose contract
      # lived in the suite is no longer exercised, so this job needs no node.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check .

      # Fuzzy (property-based) + smoke tests. pytest/pytest-cov/hypothesis/httpx
      # are pinned in requirements-dev.txt. Coverage is reported but NOT gated:
      # there is no --fail-under, so a coverage regression never surprises CI.
      - name: Pytest (fuzzy + smoke)
        run: python -m pytest --cov=app --cov-report=term-missing

  frontend:
    name: frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  security:
    name: security (pip-audit + npm audit + gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: gitleaks scans commits, so a shallow clone would miss
      # secrets that are already deleted from the tip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # pip-audit is pinned in requirements-dev.txt so CI resolves the same
      # version the project documents.
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      # Policy: fail the build on ANY advisory. There is no ignore list and no
      # --ignore-vuln flag: fastapi and starlette are both pinned exactly in
      # backend/requirements.txt, so every fixed release is reachable.
      - name: pip-audit (runtime dependencies)
        run: python -m pip_audit -r backend/requirements.txt
      - name: pip-audit (dev dependencies)
        run: python -m pip_audit -r backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # 7 high findings sit in the eslint-config-next subtree (build-time lint
      # tooling, never shipped) and are above this boundary, so the job fails
      # until eslint-config-next is upgraded alongside the Next.js pin.
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          curl -sSfLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      # gitleaks exits non-zero when it finds a leak, so this step fails the job.
      # The scan is pinned to HEAD instead of gitleaks' default `--all`: a
      # fetch-depth-0 checkout has every branch in the object store, and
      # `--all` would report secrets committed on unrelated branches, turning
      # this job red for code the PR never touched. HEAD's history is complete
      # for this purpose -- a pull_request checkout is the merge commit, so it
      # contains both the PR branch and every commit it branched off from.
      - name: Secret scan
        run: gitleaks detect --source . --redact --no-banner --log-opts="-p -U0 --full-history HEAD"
