line-length = 120
target-version = "py311"

[lint.per-file-ignores]
# Pragmatic baseline; each ignore is a deliberate choice, not a leftover:
#   BLE001  - broad except is intentional in resilient boundary code (cache/health/analytics/indexers)
#   ASYNC230- blocking file IO is fine in single-threaded async CLI scripts
#   SIM115  - flock lock files are deliberately not context-managed
#   FURB162 - explicit timezone normalization is clearer than fromisoformat
"app/health.py" = ["BLE001"]
"app/redis_cache.py" = ["BLE001"]
"app/analytics.py" = ["BLE001"]
"app/cost_budget.py" = ["BLE001"]
"app/encoders.py" = ["BLE001"]
"scripts/*" = ["BLE001", "ASYNC230", "SIM115"]
"app/main.py" = ["FURB162"]
