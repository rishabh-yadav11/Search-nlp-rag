# Rotate app logs (cron jobs, backfills, manual runs) and PM2 service logs.
# copytruncate keeps open file handles (PM2, shell-redirect cron logs) writing
# to the same inode after rotation.
#
# Installed to /etc/logrotate.d/vccircle. REPLACE the placeholder paths below
# with the real absolute paths before installing: logrotate has no variable
# interpolation, so the checkout location cannot be derived here. `logs/` is
# <repo>/logs as created by setup.sh ($SCRIPT_DIR/logs).
#
# App logs:    /path/to/search-nlp-rag/logs/*.log    -> 14 daily, compressed
# PM2 logs:    /path/to/.pm2/logs/*.log              -> 7 daily, compressed
#
# `su` names the account that owns the rotated files. It is commented out by
# default (logrotate then runs as root, the correct behaviour whenever the logs
# are root-owned); uncomment and set it to <user> <group> if they are not.
/path/to/search-nlp-rag/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    copytruncate
    notifempty
    # su deploy-user deploy-group
}

/path/to/.pm2/logs/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    copytruncate
    notifempty
    # su deploy-user deploy-group
}
