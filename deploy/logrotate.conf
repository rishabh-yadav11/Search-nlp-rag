# Rotate app logs (cron jobs, backfills, manual runs) and PM2 service logs.
# copytruncate keeps open file handles (PM2, shell-redirect cron logs) writing
# to the same inode after rotation.
#
# This file is a TEMPLATE. The paths and the `su` account below are
# placeholders, not values to run: logrotate has no variable interpolation, so
# the real ones are only knowable on the host, and left in place they match no
# files at all -- which `missingok` turns into silence, with logrotate still
# reporting success.
#
# Preferred: let the stage render it for this machine and install the result.
#
#   ./setup.sh logrotate
#
# It rewrites both globs to this checkout's log directory and to pm2's log
# directory under the invoking account, activates the `su` directive with that
# account, and installs to /etc/logrotate.d/vccircle (override the destination
# with LOGROTATE_CONF). Copying this file there by hand instead means
# substituting every placeholder yourself, the `su` line included; that is
# exactly what the stage does for you.
#
# App logs:    <repo>/logs/*.log    -> 14 daily, compressed
# PM2 logs:    ~/.pm2/logs/*.log    ->  7 daily, compressed
/path/to/search-nlp-rag/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    copytruncate
    notifempty
    # su deploy-user deploy-group
}

/path/to/.pm2/logs/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    copytruncate
    notifempty
    # su deploy-user deploy-group
}
