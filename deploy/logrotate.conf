# Rotate app logs (cron jobs, backfills, manual runs) and PM2 service logs.
# Installed to /etc/logrotate.d/vccircle. copytruncate keeps open file handles
# (PM2, shell-redirect cron logs) writing to the same inode after rotation.
#
# App logs:    ~/search-nlp-rag/logs/*.log          -> 14 daily, compressed
# PM2 logs:    ~/.pm2/logs/*.log                    -> 7 daily, compressed

/home/ubuntu/search-nlp-rag/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    copytruncate
    notifempty
    su ubuntu ubuntu
}

/home/ubuntu/.pm2/logs/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    copytruncate
    notifempty
    su ubuntu ubuntu
}
